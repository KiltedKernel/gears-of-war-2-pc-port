# XenonRecomp config for Gears of War 2 (Xbox 360, title update: none). Paths relative to this file.
# default.xex comes from the player's own disc (..gow2-decomp is the dev copy; never committed or shipped).
[main]
file_path = "../game_link/default.xex"
out_directory_path = "../ppc"
switch_table_file_path = "GOW2_switch_tables.toml"

# optimizations stay off until the recompilation runs correctly (XenonRecomp README)
skip_lr = false
skip_msr = false
ctr_as_local = false
xer_as_local = false
reserved_as_local = false
cr_as_local = false
non_argument_as_local = false
non_volatile_as_local = false

# register save/restore helpers (byte patterns from the XenonRecomp README; one match each in .text)
restgprlr_14_address = 0x82A930F0
savegprlr_14_address = 0x82A930A0
restfpr_14_address = 0x82A9344C
savefpr_14_address = 0x82A93400
restvmx_14_address = 0x82A944E8
savevmx_14_address = 0x82A94250
restvmx_64_address = 0x82A9457C
savevmx_64_address = 0x82A942E4

invalid_instructions = [
    { data = 0x00000000, size = 4 }, # padding
]

